name: CI

on:
  push:
    branches: ["main", "workflow", "develop"]
  pull_request:
    branches: ["main", "workflow"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npx tsc --noEmit --skipLibCheck

      - name: Tests
        run: npm test

      - name: Build (Next.js)
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: fake-api-key-for-ci
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: fake.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: fake-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: fake.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:123:web:fake
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-FAKE
          FIREBASE_PROJECT_ID: fake-project
          FIREBASE_CLIENT_EMAIL: fake@fake.iam.gserviceaccount.com
          FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nMIIBVAIBADANBgkqhkiG9w0BAQEFAASCAT4A\n-----END PRIVATE KEY-----\n"
